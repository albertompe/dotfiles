name: e2e-install

on:
  # TEMPORARY: workflow_dispatch is only offered on the default branch, and
  # main does not carry .github/ yet, so there is no other way to launch this.
  # Remove the push trigger once this branch is merged to main.
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: debian (apt)
            os: ubuntu-latest
            container: debian:bookworm
            kvm: 'false'
          - label: fedora (dnf)
            os: ubuntu-latest
            container: fedora:latest
            kvm: 'false'
          - label: ubuntu (apt)
            os: ubuntu-latest
            kvm: 'true'
          - label: macos (homebrew)
            os: macos-latest
            kvm: 'false'
    env:
      CHEZMOI_HEADLESS: 'true'
      CHEZMOI_ENABLE_CONTAINER_SERVICES: 'false'
      CHEZMOI_ENABLE_KVM: ${{ matrix.kvm }}
      CHEZMOI_MISE_TOOLS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install chezmoi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! command -v curl >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -y && apt-get install -y curl
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y curl
            fi
          fi
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PATH=$HOME/.local/bin:$PATH" >> "$GITHUB_ENV"
          "$HOME/.local/bin/chezmoi" --version

      - name: Ensure sudo and python3 (container jobs)
        if: runner.os == 'Linux'
        run: |
          if ! command -v sudo >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -y && apt-get install -y sudo
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y sudo
            fi
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -y && apt-get install -y python3
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y python3
            fi
          fi
          command -v sudo >/dev/null && command -v python3 >/dev/null

      - name: Fix home SSH directory permissions (runner images)
        run: |
          chmod 700 "$HOME/.ssh" 2>/dev/null || true

      - name: Prepare home layout
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$HOME/.local/share/chezmoi" "$HOME/.config/chezmoi"
          # Not `tar | tar`: only the consumer's status is checked there, so a
          # failing producer silently seeds an incomplete source tree and every
          # later step validates a partial repo.
          tar --exclude=.git -cf "$RUNNER_TEMP/src.tar" -C . .
          tar -C "$HOME/.local/share/chezmoi" -xf "$RUNNER_TEMP/src.tar"
          rm -f "$RUNNER_TEMP/src.tar"
          test -f "$HOME/.local/share/chezmoi/.chezmoi.toml.tmpl"

      - name: Render chezmoi config
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi execute-template --init < .chezmoi.toml.tmpl > "$HOME/.config/chezmoi/chezmoi.toml"

      - name: Apply dotfiles (real install)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi apply

      - name: Verify target state
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi verify --exclude scripts

      - name: Simulate a Fedora host install and run the KVM script (regression for dnf5 already-installed / qemu-img)
        if: matrix.container == 'fedora:latest'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          sudo dnf install -y qemu-system-x86 libvirt-client
          CFG="$HOME/.config/chezmoi/chezmoi.toml"
          sed -i 's/isContainer = true/isContainer = false/; s/enableKvm = false/enableKvm = true/' "$CFG"
          # Assert the rewrite landed. The substitutions are coupled to the
          # exact text of .chezmoi.toml.tmpl, so a spacing change there would
          # otherwise turn this regression test into a silent no-op.
          grep -q '^ *isContainer = false' "$CFG" || { echo "FAIL: isContainer rewrite did not apply"; exit 1; }
          grep -q '^ *enableKvm = true' "$CFG" || { echo "FAIL: enableKvm rewrite did not apply"; exit 1; }
          chezmoi apply

      - name: Verify Podman configured
        if: runner.os == 'Linux'
        run: |
          command -v podman >/dev/null || { echo "FAIL: podman missing"; exit 1; }
          podman --version
          grep -q '^unqualified-search-registries' /etc/containers/registries.conf || { echo "FAIL: registries.conf not configured"; exit 1; }
          echo "OK podman"

      - name: Verify Docker installed
        if: runner.os == 'Linux'
        run: |
          command -v docker >/dev/null || { echo "FAIL: docker CLI missing"; exit 1; }
          docker --version
          if command -v dpkg >/dev/null 2>&1; then
            for pkg in docker-ce docker-ce-cli containerd.io docker-compose-plugin; do
              dpkg -s "$pkg" >/dev/null 2>&1 || { echo "FAIL: $pkg not installed"; exit 1; }
            done
            [ -f /etc/apt/sources.list.d/docker.list ] || { echo "FAIL: docker.list missing"; exit 1; }
          elif command -v rpm >/dev/null 2>&1; then
            for pkg in docker-ce docker-ce-cli containerd.io docker-compose-plugin; do
              rpm -q "$pkg" >/dev/null 2>&1 || { echo "FAIL: $pkg not installed"; exit 1; }
            done
            [ -f /etc/yum.repos.d/docker-ce.repo ] || { echo "FAIL: docker-ce.repo missing"; exit 1; }
          else
            echo "FAIL: neither dpkg nor rpm available; cannot verify Docker packages"; exit 1
          fi
          echo "OK docker"

      - name: Verify KVM packages installed
        if: runner.os == 'Linux' && (matrix.kvm == 'true' || matrix.container == 'fedora:latest')
        run: |
          if command -v dpkg >/dev/null 2>&1; then
            for pkg in qemu-system-x86 qemu-utils libvirt-daemon-system libvirt-clients virtinst ovmf; do
              dpkg -s "$pkg" >/dev/null 2>&1 || { echo "FAIL: $pkg not installed"; exit 1; }
              echo "OK $pkg"
            done
          elif command -v rpm >/dev/null 2>&1; then
            for pkg in qemu-system-x86 qemu-img libvirt libvirt-client virt-install edk2-ovmf; do
              rpm -q "$pkg" >/dev/null 2>&1 || { echo "FAIL: $pkg not installed"; exit 1; }
              echo "OK $pkg"
            done
          else
            echo "FAIL: neither dpkg nor rpm available; cannot verify KVM packages"; exit 1
          fi

      - name: Check libvirtd service (informational)
        if: matrix.kvm == 'true'
        run: |
          if sudo systemctl is-active libvirtd >/dev/null 2>&1; then
            echo "libvirtd is active"
            sudo virsh list --all
          else
            echo "libvirtd not active on this runner (nested virt may be unavailable) — informational only"
          fi

      - name: Report installed mise tools
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if [ -x "$HOME/.local/bin/mise" ]; then
            MISE_BIN="$HOME/.local/bin/mise"
          elif [ -x /opt/homebrew/bin/mise ]; then
            MISE_BIN=/opt/homebrew/bin/mise
          fi
          if [ -n "${MISE_BIN:-}" ]; then
            "$MISE_BIN" ls
          else
            echo "mise not found in expected locations"
            exit 1
          fi

      - name: Validate TOML files parse
        run: |
          python3 - <<'EOF'
          import pathlib, tomllib
          home = pathlib.Path.home()
          files = [
              home / ".config/chezmoi/chezmoi.toml",
              *sorted(pathlib.Path(".chezmoidata").glob("*.toml")),
              pathlib.Path("dot_config/mise/config.toml"),
              pathlib.Path("dot_config/mise/config.local.toml"),
          ]
          for f in files:
              with open(f, "rb") as fh:
                  tomllib.load(fh)
              print(f"OK {f}")
          EOF
