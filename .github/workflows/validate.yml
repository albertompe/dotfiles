name: validate

on:
  # Every push on every branch, so a branch is validated before it is merged
  # to main rather than only after.
  push:
  # Same-repo PRs are already covered by the push trigger above; running on
  # pull_request too would double every run. This is here for pull requests
  # from forks, whose branches never produce a push event in this repo, and
  # the jobs below are guarded accordingly.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The matrix is 33 jobs, 8 of them macOS. Without cancellation a burst of
# pushes queues full runs indefinitely.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    # Skip the duplicate run a same-repo pull request would trigger on top of
    # its own push event. Fork PRs have no push event here, so they still run.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/chezmoi" --version

      - name: Install shellcheck and actionlint
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -C "$HOME/.local/bin" -xzf "$RUNNER_TEMP/actionlint.tar.gz" actionlint
          shellcheck --version
          actionlint --version
        env:
          ACTIONLINT_VERSION: 1.7.7

      - name: Run lint
        run: make lint

  validate:
    name: ${{ matrix.label }}
    # See the lint job: avoids running twice for same-repo pull requests.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: debian / mise tools / services=on
            os: ubuntu-latest
            container: debian:bookworm
            mise_tools: 'true'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: debian / mise tools / services=off
            os: ubuntu-latest
            container: debian:bookworm
            mise_tools: 'true'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: debian / bare mise / services=on
            os: ubuntu-latest
            container: debian:bookworm
            mise_tools: 'false'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: debian / bare mise / services=off
            os: ubuntu-latest
            container: debian:bookworm
            mise_tools: 'false'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: fedora / mise tools / services=on
            os: ubuntu-latest
            container: fedora:latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: fedora / mise tools / services=off
            os: ubuntu-latest
            container: fedora:latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: fedora / bare mise / services=on
            os: ubuntu-latest
            container: fedora:latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: fedora / bare mise / services=off
            os: ubuntu-latest
            container: fedora:latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: ubuntu / mise tools / headless=on services=on kvm=on
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'true'
            kvm: 'true'
          - label: ubuntu / mise tools / headless=on services=on kvm=off
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: ubuntu / mise tools / headless=on services=off kvm=on
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'false'
            kvm: 'true'
          - label: ubuntu / mise tools / headless=on services=off kvm=off
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: ubuntu / mise tools / headless=off services=on kvm=on
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'true'
            kvm: 'true'
          - label: ubuntu / mise tools / headless=off services=on kvm=off
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'true'
            kvm: 'false'
          - label: ubuntu / mise tools / headless=off services=off kvm=on
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'false'
            kvm: 'true'
          - label: ubuntu / mise tools / headless=off services=off kvm=off
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'false'
            kvm: 'false'
          - label: ubuntu / bare mise / headless=on services=on kvm=on
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'true'
            kvm: 'true'
          - label: ubuntu / bare mise / headless=on services=on kvm=off
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: ubuntu / bare mise / headless=on services=off kvm=on
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'false'
            kvm: 'true'
          - label: ubuntu / bare mise / headless=on services=off kvm=off
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: ubuntu / bare mise / headless=off services=on kvm=on
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'true'
            kvm: 'true'
          - label: ubuntu / bare mise / headless=off services=on kvm=off
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'true'
            kvm: 'false'
          - label: ubuntu / bare mise / headless=off services=off kvm=on
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'false'
            kvm: 'true'
          - label: ubuntu / bare mise / headless=off services=off kvm=off
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'false'
            kvm: 'false'
          # The kvm axis is inert on macOS: run_once_before_32 is gated on
          # `eq .chezmoi.os "linux"`, so it renders to nothing on darwin
          # regardless. Only kvm=off is exercised here; carrying both values
          # doubled the most expensive rows in the matrix for no coverage.
          - label: macos / mise tools / headless=on services=on
            os: macos-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: macos / mise tools / headless=on services=off
            os: macos-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: macos / mise tools / headless=off services=on
            os: macos-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'true'
            kvm: 'false'
          - label: macos / mise tools / headless=off services=off
            os: macos-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'false'
            kvm: 'false'
          - label: macos / bare mise / headless=on services=on
            os: macos-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: macos / bare mise / headless=on services=off
            os: macos-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: macos / bare mise / headless=off services=on
            os: macos-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'true'
            kvm: 'false'
          - label: macos / bare mise / headless=off services=off
            os: macos-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'false'
            kvm: 'false'
    env:
      CHEZMOI_HEADLESS: ${{ matrix.headless }}
      CHEZMOI_ENABLE_CONTAINER_SERVICES: ${{ matrix.container_services }}
      CHEZMOI_ENABLE_KVM: ${{ matrix.kvm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install chezmoi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! command -v curl >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -y && apt-get install -y curl
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y curl
            fi
          fi
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PATH=$HOME/.local/bin:$PATH" >> "$GITHUB_ENV"
          "$HOME/.local/bin/chezmoi" --version

      - name: Prepare home layout
        run: |
          mkdir -p "$HOME/.local/share/chezmoi" "$HOME/.config/chezmoi"
          # Not `tar | tar`: only the consumer's status is checked there, so a
          # failing producer silently seeds an incomplete source tree and every
          # later step validates a partial repo.
          tar --exclude=.git -cf "$RUNNER_TEMP/src.tar" -C . .
          tar -C "$HOME/.local/share/chezmoi" -xf "$RUNNER_TEMP/src.tar"
          rm -f "$RUNNER_TEMP/src.tar"
          test -f "$HOME/.local/share/chezmoi/.chezmoi.toml.tmpl"

      - name: Render chezmoi config
        env:
          CHEZMOI_MISE_TOOLS: ${{ matrix.mise_tools }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi execute-template --init < .chezmoi.toml.tmpl > "$HOME/.config/chezmoi/chezmoi.toml"
          echo "--- generated config ---"
          cat "$HOME/.config/chezmoi/chezmoi.toml"

      - name: Apply to staging destination (no scripts)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/ci-home"
          chezmoi apply --destination "$RUNNER_TEMP/ci-home" --exclude scripts

      - name: Verify target state
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi verify --destination "$RUNNER_TEMP/ci-home" --exclude scripts

      - name: Lint run_once templates for this combination
        env:
          CHEZMOI_MISE_TOOLS: ${{ matrix.mise_tools }}
          # Only this job's combination, but rendered on this job's OS, which
          # is what exercises the distro-specific template branches.
          LINT_COMBOS: "${{ matrix.headless }}:${{ matrix.mise_tools }}:${{ matrix.container_services }}:${{ matrix.kvm }}"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          .ci/lint.sh templates

      - name: Ensure python3 (container jobs)
        if: runner.os == 'Linux'
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -y && apt-get install -y python3
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y python3
            fi
          fi
          command -v python3 >/dev/null

      - name: Validate TOML files parse
        run: |
          .ci/lint.sh toml
          python3 -c "import tomllib,sys; tomllib.load(open(sys.argv[1],'rb'))" \
            "$HOME/.config/chezmoi/chezmoi.toml"
          echo "OK generated chezmoi.toml"
