name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu / mise tools
            os: ubuntu-latest
            mise_tools: 'true'
          - label: ubuntu / bare mise
            os: ubuntu-latest
            mise_tools: 'false'
          - label: debian / mise tools
            os: ubuntu-latest
            container: debian:bookworm
            mise_tools: 'true'
          - label: debian / bare mise
            os: ubuntu-latest
            container: debian:bookworm
            mise_tools: 'false'
          - label: fedora / mise tools
            os: ubuntu-latest
            container: fedora:latest
            mise_tools: 'true'
          - label: fedora / bare mise
            os: ubuntu-latest
            container: fedora:latest
            mise_tools: 'false'
          - label: macos / mise tools
            os: macos-latest
            mise_tools: 'true'
          - label: macos / bare mise
            os: macos-latest
            mise_tools: 'false'
    env:
      CHEZMOI_HEADLESS: 'true'
      CHEZMOI_ENABLE_CONTAINER_SERVICES: 'false'
      CHEZMOI_ENABLE_KVM: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! command -v curl >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -y && apt-get install -y curl
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y curl
            fi
          fi
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PATH=$HOME/.local/bin:$PATH" >> "$GITHUB_ENV"
          "$HOME/.local/bin/chezmoi" --version

      - name: Prepare home layout
        run: |
          mkdir -p "$HOME/.local/share/chezmoi" "$HOME/.config/chezmoi"
          tar --exclude=.git -C . -cf - . | tar -C "$HOME/.local/share/chezmoi" -xf -

      - name: Render chezmoi config
        env:
          CHEZMOI_MISE_TOOLS: ${{ matrix.mise_tools }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi execute-template --init < .chezmoi.toml.tmpl > "$HOME/.config/chezmoi/chezmoi.toml"
          echo "--- generated config ---"
          cat "$HOME/.config/chezmoi/chezmoi.toml"

      - name: Apply to staging destination (no scripts)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/ci-home"
          chezmoi apply --destination "$RUNNER_TEMP/ci-home" --exclude scripts

      - name: Verify target state
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi verify --destination "$RUNNER_TEMP/ci-home" --exclude scripts

      - name: Ensure python3 (container jobs)
        if: runner.os == 'Linux'
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -y && apt-get install -y python3
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y python3
            fi
          fi
          command -v python3 >/dev/null

      - name: Validate TOML files parse
        run: |
          python3 - <<'EOF'
          import pathlib, tomllib
          home = pathlib.Path.home()
          files = [
              home / ".config/chezmoi/chezmoi.toml",
              *sorted(pathlib.Path(".chezmoidata").glob("*.toml")),
              pathlib.Path("dot_config/mise/config.toml"),
              pathlib.Path("dot_config/mise/config.local.toml"),
          ]
          for f in files:
              with open(f, "rb") as fh:
                  tomllib.load(fh)
              print(f"OK {f}")
          EOF

  flag-combinations:
    name: apply + run_once templates (all flag combinations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PATH=$HOME/.local/bin:$PATH" >> "$GITHUB_ENV"
          "$HOME/.local/bin/chezmoi" --version

      - name: Prepare home layout
        run: |
          mkdir -p "$HOME/.local/share/chezmoi" "$HOME/.config/chezmoi"
          tar --exclude=.git -C . -cf - . | tar -C "$HOME/.local/share/chezmoi" -xf -

      - name: Apply, verify and lint run_once across all flag combinations
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          config="$HOME/.config/chezmoi/chezmoi.toml"
          apply_total=0
          lint_total=0
          for headless in true false; do
            for services in true false; do
              for kvm in true false; do
                for mise in true false; do
                  export CHEZMOI_HEADLESS="$headless"
                  export CHEZMOI_ENABLE_CONTAINER_SERVICES="$services"
                  export CHEZMOI_ENABLE_KVM="$kvm"
                  export CHEZMOI_MISE_TOOLS="$mise"
                  chezmoi execute-template --init < .chezmoi.toml.tmpl > "$config"
                  dest="${RUNNER_TEMP:-/tmp}/ci-combo-$headless-$services-$kvm-$mise"
                  rm -rf "$dest"
                  mkdir -p "$dest"
                  chezmoi apply --destination "$dest" --exclude scripts
                  chezmoi verify --destination "$dest" --exclude scripts
                  apply_total=$((apply_total + 1))
                  for f in run_once_*.tmpl; do
                    out="${TMPDIR:-/tmp}/$(basename "${f%.tmpl}").sh"
                    chezmoi execute-template "$f" > "$out"
                    if grep -q '{{' "$out"; then
                      echo "ERROR: unresolved template directives in $f (headless=$headless services=$services kvm=$kvm mise=$mise)"
                      exit 1
                    fi
                    bash -n "$out"
                    lint_total=$((lint_total + 1))
                  done
                done
              done
            done
          done
          echo "OK: $apply_total apply/verify + $lint_total run_once lints across 16 combinations"
