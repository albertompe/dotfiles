name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: debian / mise tools / services=on
            os: ubuntu-latest
            container: debian:bookworm
            mise_tools: 'true'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: debian / mise tools / services=off
            os: ubuntu-latest
            container: debian:bookworm
            mise_tools: 'true'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: debian / bare mise / services=on
            os: ubuntu-latest
            container: debian:bookworm
            mise_tools: 'false'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: debian / bare mise / services=off
            os: ubuntu-latest
            container: debian:bookworm
            mise_tools: 'false'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: fedora / mise tools / services=on
            os: ubuntu-latest
            container: fedora:latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: fedora / mise tools / services=off
            os: ubuntu-latest
            container: fedora:latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: fedora / bare mise / services=on
            os: ubuntu-latest
            container: fedora:latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: fedora / bare mise / services=off
            os: ubuntu-latest
            container: fedora:latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: ubuntu / mise tools / headless=on services=on kvm=on
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'true'
            kvm: 'true'
          - label: ubuntu / mise tools / headless=on services=on kvm=off
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: ubuntu / mise tools / headless=on services=off kvm=on
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'false'
            kvm: 'true'
          - label: ubuntu / mise tools / headless=on services=off kvm=off
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: ubuntu / mise tools / headless=off services=on kvm=on
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'true'
            kvm: 'true'
          - label: ubuntu / mise tools / headless=off services=on kvm=off
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'true'
            kvm: 'false'
          - label: ubuntu / mise tools / headless=off services=off kvm=on
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'false'
            kvm: 'true'
          - label: ubuntu / mise tools / headless=off services=off kvm=off
            os: ubuntu-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'false'
            kvm: 'false'
          - label: ubuntu / bare mise / headless=on services=on kvm=on
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'true'
            kvm: 'true'
          - label: ubuntu / bare mise / headless=on services=on kvm=off
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: ubuntu / bare mise / headless=on services=off kvm=on
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'false'
            kvm: 'true'
          - label: ubuntu / bare mise / headless=on services=off kvm=off
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: ubuntu / bare mise / headless=off services=on kvm=on
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'true'
            kvm: 'true'
          - label: ubuntu / bare mise / headless=off services=on kvm=off
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'true'
            kvm: 'false'
          - label: ubuntu / bare mise / headless=off services=off kvm=on
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'false'
            kvm: 'true'
          - label: ubuntu / bare mise / headless=off services=off kvm=off
            os: ubuntu-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'false'
            kvm: 'false'
          - label: macos / mise tools / headless=on services=on kvm=on
            os: macos-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'true'
            kvm: 'true'
          - label: macos / mise tools / headless=on services=on kvm=off
            os: macos-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: macos / mise tools / headless=on services=off kvm=on
            os: macos-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'false'
            kvm: 'true'
          - label: macos / mise tools / headless=on services=off kvm=off
            os: macos-latest
            mise_tools: 'true'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: macos / mise tools / headless=off services=on kvm=on
            os: macos-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'true'
            kvm: 'true'
          - label: macos / mise tools / headless=off services=on kvm=off
            os: macos-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'true'
            kvm: 'false'
          - label: macos / mise tools / headless=off services=off kvm=on
            os: macos-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'false'
            kvm: 'true'
          - label: macos / mise tools / headless=off services=off kvm=off
            os: macos-latest
            mise_tools: 'true'
            headless: 'false'
            container_services: 'false'
            kvm: 'false'
          - label: macos / bare mise / headless=on services=on kvm=on
            os: macos-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'true'
            kvm: 'true'
          - label: macos / bare mise / headless=on services=on kvm=off
            os: macos-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'true'
            kvm: 'false'
          - label: macos / bare mise / headless=on services=off kvm=on
            os: macos-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'false'
            kvm: 'true'
          - label: macos / bare mise / headless=on services=off kvm=off
            os: macos-latest
            mise_tools: 'false'
            headless: 'true'
            container_services: 'false'
            kvm: 'false'
          - label: macos / bare mise / headless=off services=on kvm=on
            os: macos-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'true'
            kvm: 'true'
          - label: macos / bare mise / headless=off services=on kvm=off
            os: macos-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'true'
            kvm: 'false'
          - label: macos / bare mise / headless=off services=off kvm=on
            os: macos-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'false'
            kvm: 'true'
          - label: macos / bare mise / headless=off services=off kvm=off
            os: macos-latest
            mise_tools: 'false'
            headless: 'false'
            container_services: 'false'
            kvm: 'false'
    env:
      CHEZMOI_HEADLESS: ${{ matrix.headless }}
      CHEZMOI_ENABLE_CONTAINER_SERVICES: ${{ matrix.container_services }}
      CHEZMOI_ENABLE_KVM: ${{ matrix.kvm }}
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! command -v curl >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -y && apt-get install -y curl
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y curl
            fi
          fi
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "PATH=$HOME/.local/bin:$PATH" >> "$GITHUB_ENV"
          "$HOME/.local/bin/chezmoi" --version

      - name: Prepare home layout
        run: |
          mkdir -p "$HOME/.local/share/chezmoi" "$HOME/.config/chezmoi"
          tar --exclude=.git -C . -cf - . | tar -C "$HOME/.local/share/chezmoi" -xf -

      - name: Render chezmoi config
        env:
          CHEZMOI_MISE_TOOLS: ${{ matrix.mise_tools }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi execute-template --init < .chezmoi.toml.tmpl > "$HOME/.config/chezmoi/chezmoi.toml"
          echo "--- generated config ---"
          cat "$HOME/.config/chezmoi/chezmoi.toml"

      - name: Apply to staging destination (no scripts)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/ci-home"
          chezmoi apply --destination "$RUNNER_TEMP/ci-home" --exclude scripts

      - name: Verify target state
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          chezmoi verify --destination "$RUNNER_TEMP/ci-home" --exclude scripts

      - name: Lint run_once templates for this combination
        env:
          CHEZMOI_MISE_TOOLS: ${{ matrix.mise_tools }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for f in run_once_*.tmpl; do
            out="${TMPDIR:-/tmp}/$(basename "${f%.tmpl}").sh"
            chezmoi execute-template < "$f" > "$out"
            if grep -q '{{' "$out"; then
              echo "ERROR: unresolved template directives in $f"
              exit 1
            fi
            bash -n "$out"
          done
          echo "run_once templates OK"

      - name: Ensure python3 (container jobs)
        if: runner.os == 'Linux'
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -y && apt-get install -y python3
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y python3
            fi
          fi
          command -v python3 >/dev/null

      - name: Validate TOML files parse
        run: |
          python3 - <<'EOF'
          import pathlib, tomllib
          home = pathlib.Path.home()
          files = [
              home / ".config/chezmoi/chezmoi.toml",
              *sorted(pathlib.Path(".chezmoidata").glob("*.toml")),
              pathlib.Path("dot_config/mise/config.toml"),
              pathlib.Path("dot_config/mise/config.local.toml"),
          ]
          for f in files:
              with open(f, "rb") as fh:
                  tomllib.load(fh)
              print(f"OK {f}")
          EOF
