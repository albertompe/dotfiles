[flatpak]
    remotes = [
        { name = "flathub", url = "https://dl.flathub.org/repo/flathub.flatpakrepo" }
    ]

    # Applications to install only on desktop/GUI setups
    gui_apps = [
        "com.spotify.Client",
        "org.videolan.VLC"
    ]

    # Headless / CLI Flatpaks (usually empty)
    cli_apps = []
